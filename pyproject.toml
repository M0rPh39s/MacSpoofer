[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macspoofer"
version = "0.1.0"
description = "Interactive MAC address spoofing with a catalogue of real device profiles, for macOS and Linux."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "M0rPh39s", email = "ghassen.boulares@medtech.tn" }]
keywords = ["security", "mac-address", "spoofing", "privacy", "oui", "networking", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/M0rPh39s/MacSpoofer"
Repository = "https://github.com/M0rPh39s/MacSpoofer"

[project.scripts]
macspoofer = "macspoofer.cli:main"

[tool.setuptools.packages.find]
include = ["macspoofer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
